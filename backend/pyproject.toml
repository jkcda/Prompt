[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-prompt-reverse"
version = "1.0.0"
description = "上传视频或从 B站/抖音抓取，用 ffmpeg 镜头分割 + 自适应抽帧，经两阶段多模态反推生成视频生成提示词"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlmodel>=0.0.16",
    "httpx>=0.27",
    "yt-dlp>=2024.4.9",
]

[project.optional-dependencies]
# 拼联络表预览图（缺省不影响主流程）
images = ["Pillow>=10.0"]
# 本地语音转写（**可选兜底**）。推荐直接用线上 ASR API —— 免费额度够用
# （硅基流动 / Groq），不用下 460MB 权重也不用占 1.2GB 内存。
# 装了它、且没配 ASR_BASE_URL / ASR_API_KEY 时才会走到本地。
local-asr = ["faster-whisper>=1.0.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
prompt-reverse = "app.main:main"

# FastAPI CLI 读这里定位应用：fastapi dev / fastapi run 不用再传路径
[tool.fastapi]
entrypoint = "app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["frontend", "data", "runtime", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # 行宽交给 formatter
    "B008",   # FastAPI 的 Depends() 默认值写法
    "SIM108", # 三元表达式不强求
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
